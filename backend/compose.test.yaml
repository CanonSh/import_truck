# Entorno desechable. Sin puertos publicados ni acceso a bases existentes.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: isolated-tests-only
      MYSQL_ROOT_HOST: '%'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_DB_HOST: mysql
      TEST_DB_PORT: '3306'
      TEST_DB_USER: root
      TEST_DB_PASSWORD: isolated-tests-only
    depends_on:
      mysql:
        condition: service_healthy
